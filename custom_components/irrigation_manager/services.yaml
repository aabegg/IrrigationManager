start_manual: &manual_action
  fields: &manual_fields
    config_entry_id: &installation
      required: true
      selector:
        config_entry:
          integration: irrigation_manager
    zone_subentry_id: &zone
      required: true
      selector:
        text:
    duration: &duration
      required: false
      example: "00:10:00"
      selector:
        text:
          suffix: HH:MM:SS
    amount: &amount
      required: false
      selector:
        number:
          min: 0.001
          max: 1000000
          step: 0.001
          unit_of_measurement: L
          mode: box
    hard_time_limit: &hard_time_limit
      required: false
      example: "01:00:00"
      selector:
        text:
          suffix: HH:MM:SS
    expiry:
      required: false
      example: "01:00:00"
      selector:
        text:
          suffix: HH:MM:SS
    start_at:
      required: false
      selector:
        datetime:

create_manual: *manual_action

start_manual_from_card:
  fields:
    config_entry_id: *installation
    zone_subentry_id: *zone
    duration: *duration
    amount: *amount
    hard_time_limit: *hard_time_limit
    conflict_policy:
      required: true
      selector:
        select:
          options:
            - start_now
            - stop_active
            - priority_next

cancel_request:
  fields:
    config_entry_id: *installation
    request_id:
      required: true
      selector:
        text:

stop:
  fields:
    config_entry_id: *installation
    execution_id:
      required: true
      selector:
        text:

emergency_stop:
  fields:
    config_entry_id: *installation

set_installation_operation:
  fields:
    config_entry_id: *installation
    enabled: &enabled
      required: true
      selector:
        boolean:

set_installation_automation:
  fields:
    config_entry_id: *installation
    enabled: *enabled
    stop_active: &stop_active
      required: false
      default: false
      selector:
        boolean:

set_zone_operation:
  fields:
    config_entry_id: *installation
    zone_subentry_id: *zone
    enabled: *enabled

set_zone_automation:
  fields:
    config_entry_id: *installation
    zone_subentry_id: *zone
    enabled: *enabled
    stop_active: *stop_active

reset_safety_lock:
  fields:
    config_entry_id: *installation

plan_automatic:
  fields:
    config_entry_id: *installation

correct_physical_meter:
  fields:
    config_entry_id: *installation
    physical_total:
      required: true
      selector:
        number:
          min: 0
          step: 0.001
          unit_of_measurement: L
          mode: box
    reason:
      selector:
        text:

list_card_orders:
  fields:
    config_entry_id: *installation

list_zone_history:
  fields:
    config_entry_id: *installation
    zone_subentry_id: *zone
    offset:
      default: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box
    limit:
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    source:
      required: false
      selector:
        select:
          options:
            - manual
            - automatic
            - calibration
    result:
      required: false
      selector:
        text:
